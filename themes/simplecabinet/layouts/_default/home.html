{{ define "main" }}
  <img src="/header.jpg" alt="Cabinet Maker Header" style="width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-bottom:2rem;">
  <h1>EVEN-ZAHAV FURNITURE</h1>
  <p>Handcrafted furniture and bespoke cabinetry</p>
  {{ range site.RegularPages }}
      <p>DEBUG: {{ .Title }}</p>
    {{ if and (ne .Title "Portfolio") (ne .Title "Contact") (ne .Title "About") }}
      <div class="card">
        <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
        {{ .Summary }}
      </div>
    {{ end }}
  {{ end }}
{{ end }}
